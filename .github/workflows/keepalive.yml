name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'   # каждые 10 минут (Render free спит после ~15 мин простоя)
  workflow_dispatch:        # можно запустить вручную из Actions вкладки

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend-practice
        run: |
          curl -fsS --max-time 30 https://backend-practice-ejvi.onrender.com/ \
            && echo "OK: site is awake" \
            || echo "WARN: ping failed (site may be starting up)"
